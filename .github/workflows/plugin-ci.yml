name: dsh mobile plugin CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/plugin-ci.yml'
      - 'bridge/**'
      - 'plugins/dsh-bridge/**'
      - 'scripts/verify-plugin-pack.mjs'
      - 'app/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  pull_request:
    paths:
      - '.github/workflows/plugin-ci.yml'
      - 'bridge/**'
      - 'plugins/dsh-bridge/**'
      - 'scripts/verify-plugin-pack.mjs'
      - 'app/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck all packages
        run: npm run typecheck:all
      - name: Run test suite
        run: npm test
      - name: Check bridge CLI entry point
        run: npm run bridge -- version

  plugin-package:
    name: Build and verify plugin package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Match release tag to plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          plugin_version="$(node -p 'require("./plugins/dsh-bridge/package.json").version')"
          expected="v${plugin_version}"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Release tag $GITHUB_REF_NAME does not match plugin version $expected"
            exit 1
          }
      - name: Pack and verify plugin
        run: npm run plugin:pack
      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-plugin
          path: dist/plugin/*.tgz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [verify, plugin-package]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download plugin package
        uses: actions/download-artifact@v4
        with:
          name: dsh-mobile-plugin
          path: dist/plugin
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/plugin/*.tgz \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/plugin/*.tgz \
              --repo "$GITHUB_REPOSITORY" \
              --title "dsh mobile plugin $GITHUB_REF_NAME" \
              --generate-notes
          fi
